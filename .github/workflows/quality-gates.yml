name: repository quality gates

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"
  PYTHON_VERSION: "3.12.10"

jobs:
  quality:
    name: Quality gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-toolchain.txt
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install project and quality dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe -m pip install --requirement requirements-toolchain.txt
      - name: Install release dependencies
        run: npm ci
      - name: Audit release dependencies
        run: npm run audit:release
      - name: Check license headers
        run: .\.venv\Scripts\python.exe tools\license_headers.py --check
      - name: Check architecture governance
        run: .\.venv\Scripts\python.exe tools\check_architecture.py
      - name: Check test governance
        run: .\.venv\Scripts\python.exe tools\check_test_governance.py
      - name: Check formatting
        run: .\.venv\Scripts\ruff.exe format --check .
      - name: Lint
        run: .\.venv\Scripts\ruff.exe check .
      - name: Type check
        run: .\.venv\Scripts\mypy.exe --strict substitute tests
