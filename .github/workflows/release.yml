name: release

on:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release in dry-run mode without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      qualification_scope:
        description: "Focused dry-run qualification; full runs every required gate"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - canary-fast
          - qualification-all
          - clean-all
          - clean-windows
          - clean-linux
          - clean-macos
          - updates-all
          - updates-windows
          - updates-linux
          - updates-macos
          - managed-comfy
      release_input_run_id:
        description: "Focused dry-run containing unchanged native release inputs"
        required: false
        default: ""
        type: string
      qualification_candidate_run_id:
        description: "Focused dry-run containing an already-staged candidate channel"
        required: false
        default: ""
        type: string
      qualification_candidate_version:
        description: "Exact version inside the already-staged candidate channel"
        required: false
        default: ""
        type: string
      upgrade_selection:
        description: "Focused upgrade depth; full qualification always uses complete"
        required: false
        default: "complete"
        type: choice
        options:
          - complete
          - latest-only
      qualification_timeout_seconds:
        description: "Focused installer-chain timeout; full qualification requires 3600"
        required: false
        default: "3600"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  NODE_VERSION: "22.14.0"
  PYTHON_VERSION: "3.12.10"
  LINUX_PYTHON_VERSION: "3.12.13"

jobs:
  tests:
    name: Required cross-platform tests
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.dry_run != 'true' ||
      github.event.inputs.qualification_scope == 'full'
    uses: ./.github/workflows/tests.yml

  determine-version:
    name: Resolve semantic release version
    needs: tests
    if: >-
      always() && (
        needs.tests.result == 'success' || (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true' &&
          github.event.inputs.qualification_scope != 'full'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && format('9999.0.{0}', github.run_number) || '') }}
      should_release: ${{ steps.release-version.outputs.should_release || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'true' || 'false') }}
      first_release: ${{ steps.release-version.outputs.first_release }}
      channel: ${{ (github.ref_name == 'canary' && 'canary') || 'stable' }}

    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Resolve next release version
        id: release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUGAR_SUBSTITUTE_CANARY_RUN_NUMBER: ${{ github.ref_name == 'canary' && github.run_number || '' }}
          SUGAR_SUBSTITUTE_QUALIFICATION_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && format('9999.0.{0}', github.run_number) || '' }}
        run: node scripts/resolve-next-release-version.mjs

  build-windows:
    name: Build Windows x64 installer
    needs: determine-version
    if: >-
      always() && (
        github.event.inputs.qualification_candidate_run_id == '' &&
        github.event.inputs.release_input_run_id == '' && (
          needs.determine-version.outputs.should_release == 'true' || (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.dry_run == 'true' &&
            github.event.inputs.qualification_scope != 'full'
          )
        )
      )
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --requirement requirements-toolchain.txt

      - name: Apply release version
        shell: pwsh
        run: node scripts\update-release-versions.mjs ${{ needs.determine-version.outputs.version }} ${{ needs.determine-version.outputs.channel }}

      - name: Build Windows launcher artifacts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe -m PyInstaller launcher\SugarSubstitute-Setup-Windows-x64.spec --noconfirm --clean
          .\.venv\Scripts\python.exe -m PyInstaller launcher\SugarSubstitute-Windows-x64.spec --noconfirm --clean --distpath build\launcher-bundles
          New-Item -ItemType Directory -Force build\release-inputs\windows | Out-Null
          Copy-Item dist\SugarSubstitute-Setup-Windows-x64.exe build\release-inputs\windows\SugarSubstitute-Setup-Windows-x64.exe
          .\.venv\Scripts\python.exe tools\build_release_payload.py package-launcher --target windows_x64 --bundle-dir build\launcher-bundles\SugarSubstitute --output-path build\release-inputs\windows\installer-payload-windows-x64.zip

      - name: Upload Windows release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-windows
          path: build/release-inputs/windows
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS Apple Silicon installer
    needs: determine-version
    if: >-
      always() && (
        github.event.inputs.qualification_candidate_run_id == '' &&
        github.event.inputs.release_input_run_id == '' && (
          needs.determine-version.outputs.should_release == 'true' || (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.dry_run == 'true' &&
            github.event.inputs.qualification_scope != 'full'
          )
        )
      )
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-toolchain.txt

      - name: Apply release version
        run: node scripts/update-release-versions.mjs ${{ needs.determine-version.outputs.version }} ${{ needs.determine-version.outputs.channel }}

      - name: Build Apple Silicon launcher artifacts
        run: |
          test "$(uname -m)" = "arm64"
          .venv/bin/python tools/build_macos_icon.py --source substitute/presentation/resources/app_icons/source.png --output build/app_icon.icns
          .venv/bin/python -m PyInstaller launcher/SugarSubstitute-Setup-macOS-arm64.spec --noconfirm --clean
          .venv/bin/python -m PyInstaller launcher/SugarSubstitute-macOS-arm64.spec --noconfirm --clean --distpath build/launcher-bundles

      - name: Ad-hoc sign and package Apple Silicon artifacts
        run: |
          codesign --force --deep --sign - "build/launcher-bundles/SugarSubstitute.app"
          codesign --force --deep --sign - "dist/SugarSubstitute Setup.app"
          codesign --verify --deep --strict --verbose=2 "build/launcher-bundles/SugarSubstitute.app"
          codesign --verify --deep --strict --verbose=2 "dist/SugarSubstitute Setup.app"
          mkdir -p build/release-inputs/macos
          mkdir -p build/installed-launcher-bundle
          ditto "build/launcher-bundles/SugarSubstitute.app" "build/installed-launcher-bundle/SugarSubstitute.app"
          .venv/bin/python tools/build_release_payload.py package-launcher --target macos_arm64 --bundle-dir build/installed-launcher-bundle --output-path build/release-inputs/macos/installer-payload-macos-arm64.zip
          .venv/bin/python tools/build_macos_dmg.py --setup-app "dist/SugarSubstitute Setup.app" --output build/release-inputs/macos/SugarSubstitute-Installer-macOS-Apple-Silicon.dmg

      - name: Upload Apple Silicon release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-macos
          path: build/release-inputs/macos
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux x64 installers
    needs: determine-version
    if: >-
      always() && (
        github.event.inputs.qualification_candidate_run_id == '' &&
        github.event.inputs.release_input_run_id == '' && (
          needs.determine-version.outputs.should_release == 'true' || (
            github.event_name == 'workflow_dispatch' &&
            github.event.inputs.dry_run == 'true' &&
            github.event.inputs.qualification_scope != 'full'
          )
        )
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.LINUX_PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-toolchain.txt

      - name: Apply release version
        run: node scripts/update-release-versions.mjs ${{ needs.determine-version.outputs.version }} ${{ needs.determine-version.outputs.channel }}

      - name: Build Linux launcher bundles
        run: |
          test "$(uname -m)" = "x86_64"
          .venv/bin/python -m PyInstaller launcher/SugarSubstitute-Setup-Linux-x64.spec --noconfirm --clean
          .venv/bin/python -m PyInstaller launcher/SugarSubstitute-Linux-x64.spec --noconfirm --clean --distpath build/launcher-bundles

      - name: Acquire pinned AppImage packaging tool
        run: |
          mkdir -p build/tools
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --output build/tools/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  build/tools/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod 755 build/tools/appimagetool-x86_64.AppImage

      - name: Package Linux release inputs
        run: |
          mkdir -p build/release-inputs/linux
          .venv/bin/python tools/build_release_payload.py package-launcher --target linux_x64 --bundle-dir build/launcher-bundles/SugarSubstitute --output-path build/release-inputs/linux/installer-payload-linux-x64.zip
          .venv/bin/python tools/build_linux_installers.py --setup-bundle "dist/SugarSubstitute Setup" --icon substitute/presentation/resources/app_icons/app_icon_256.png --appimagetool build/tools/appimagetool-x86_64.AppImage --version ${{ needs.determine-version.outputs.version }} --appimage-output build/release-inputs/linux/SugarSubstitute-Installer-Linux-x86_64.AppImage --deb-output build/release-inputs/linux/SugarSubstitute-Installer-Linux-amd64.deb

      - name: Upload Linux release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-linux
          path: build/release-inputs/linux
          if-no-files-found: error
          retention-days: 1

  stage-candidate:
    name: Stage exact release candidate
    needs:
      - determine-version
      - build-windows
      - build-macos
      - build-linux
    if: >-
      always() &&
      needs.determine-version.result == 'success' && (
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true' &&
          github.event.inputs.qualification_scope != 'full' &&
          github.event.inputs.qualification_candidate_run_id != '' &&
          github.event.inputs.qualification_candidate_version != ''
        ) || (
          needs.build-windows.result == 'success' &&
          needs.build-macos.result == 'success' &&
          needs.build-linux.result == 'success'
        ) || (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'true' &&
          github.event.inputs.qualification_scope != 'full' &&
          github.event.inputs.release_input_run_id != ''
        )
      )
    runs-on: windows-latest
    outputs:
      candidate_artifact_name: ${{ steps.reuse.outputs.candidate_artifact_name || steps.stage-artifact.outputs.candidate_artifact_name }}
      candidate_run_id: ${{ github.event.inputs.qualification_candidate_run_id || github.run_id }}
      candidate_version: ${{ github.event.inputs.qualification_candidate_version || needs.determine-version.outputs.version }}
      candidate_channel: ${{ needs.determine-version.outputs.channel }}
      staged: ${{ steps.reuse.outputs.staged || steps.stage-artifact.outputs.staged }}

    steps:
      - name: Checkout
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Python
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release dependencies
        if: github.event.inputs.qualification_candidate_run_id == ''
        shell: pwsh
        run: |
          if ("${{ needs.determine-version.outputs.channel }}" -eq "stable") {
            npm ci
          }
          python -m venv .venv

      - name: Download Windows release inputs
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-windows
          path: build/release-inputs/windows
          run-id: ${{ github.event.inputs.release_input_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Apple Silicon release inputs
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-macos
          path: build/release-inputs/macos
          run-id: ${{ github.event.inputs.release_input_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Linux release inputs
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-linux
          path: build/release-inputs/linux
          run-id: ${{ github.event.inputs.release_input_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare private release candidate assets
        if: github.event.inputs.qualification_candidate_run_id == ''
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUGAR_SUBSTITUTE_RELEASE_CHANNEL: ${{ needs.determine-version.outputs.channel }}
          SUGAR_SUBSTITUTE_ASSET_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'https://localhost:44443' || '' }}
        run: node scripts\prepare-release-assets.mjs ${{ needs.determine-version.outputs.version }}

      - name: Prepare installer release notes
        if: github.event.inputs.qualification_candidate_run_id == ''
        shell: pwsh
        run: node scripts\release-notes-preamble.cjs --repository "${{ github.repository }}" --version "${{ needs.determine-version.outputs.version }}" --channel "${{ needs.determine-version.outputs.channel }}" --output "build\release-notes.md"

      - name: Add release notes to the private candidate artifact
        if: github.event.inputs.qualification_candidate_run_id == ''
        shell: pwsh
        run: Copy-Item build\release-notes.md .local-release-channel\.release-notes.md

      - name: Upload private non-release candidate channel
        if: github.event.inputs.qualification_candidate_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: non-release-candidate-channel
          path: .local-release-channel
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

      - name: Record temporary candidate channel
        id: stage-artifact
        if: github.event.inputs.qualification_candidate_run_id == ''
        shell: pwsh
        run: |
          "candidate_artifact_name=non-release-candidate-channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "staged=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Reuse exact temporary candidate channel
        id: reuse
        if: github.event.inputs.qualification_candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ github.event.inputs.qualification_candidate_run_id }}
        shell: pwsh
        run: |
          $artifacts = gh api "repos/${{ github.repository }}/actions/runs/$env:CANDIDATE_RUN_ID/artifacts" | ConvertFrom-Json
          $candidate = @($artifacts.artifacts | Where-Object { $_.name -eq "non-release-candidate-channel" -and -not $_.expired })
          if ($candidate.Count -ne 1) {
            throw "The requested run does not contain one live non-release candidate channel."
          }
          "candidate_artifact_name=non-release-candidate-channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "staged=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  qualify-candidate:
    name: Qualify staged installer and update bytes
    needs: stage-candidate
    if: >-
      always() &&
      needs.stage-candidate.result == 'success' &&
      needs.stage-candidate.outputs.staged == 'true'
    uses: ./.github/workflows/release-qualification.yml
    with:
      candidate_version: ${{ needs.stage-candidate.outputs.candidate_version }}
      candidate_tag: ''
      candidate_channel: ${{ needs.stage-candidate.outputs.candidate_channel }}
      candidate_artifact_name: ${{ needs.stage-candidate.outputs.candidate_artifact_name }}
      candidate_run_id: ${{ needs.stage-candidate.outputs.candidate_run_id }}
      qualification_scope: ${{ github.ref_name == 'canary' && 'canary-fast' || inputs.qualification_scope == '' && 'all' || inputs.qualification_scope == 'full' && 'all' || inputs.qualification_scope }}
      upgrade_selection: ${{ inputs.dry_run == 'true' && inputs.qualification_scope != 'full' && inputs.upgrade_selection || 'complete' }}
      qualification_timeout_seconds: ${{ inputs.dry_run == 'true' && inputs.qualification_scope != 'full' && inputs.qualification_timeout_seconds || '3600' }}

  publish-release:
    name: Publish qualified bytes without rebuilding
    needs:
      - stage-candidate
      - qualify-candidate
    if: >-
      always() &&
      needs.stage-candidate.result == 'success' &&
      needs.qualify-candidate.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout complete Stable history
        if: github.ref_name == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Stable release Node
        if: github.ref_name == 'main'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Stable release dependencies
        if: github.ref_name == 'main'
        run: npm ci

      - name: Download exact qualified Stable channel
        if: github.ref_name == 'main'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.stage-candidate.outputs.candidate_artifact_name }}
          path: .local-release-channel
          run-id: ${{ needs.stage-candidate.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify qualified Stable channel identity
        if: github.ref_name == 'main'
        env:
          CANDIDATE_VERSION: ${{ needs.stage-candidate.outputs.candidate_version }}
        run: |
          set -euo pipefail
          python -c "import json, os, pathlib; payload=json.loads(pathlib.Path('.local-release-channel/manifest.json').read_text()); assert payload['channel']=='stable', payload; assert payload['version']==os.environ['CANDIDATE_VERSION'], payload"
          (cd .local-release-channel && sha256sum --check checksums.txt)

      - name: Re-resolve semantic release version after qualification
        if: github.ref_name == 'main'
        id: final-release-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/resolve-next-release-version.mjs

      - name: Require semantic release version stability
        if: github.ref_name == 'main'
        env:
          CANDIDATE_VERSION: ${{ needs.stage-candidate.outputs.candidate_version }}
          RESOLVED_VERSION: ${{ steps.final-release-version.outputs.version }}
        run: |
          set -euo pipefail
          test "$RESOLVED_VERSION" = "$CANDIDATE_VERSION"

      - name: Configure authorized Stable release push
        if: github.ref_name == 'main'
        env:
          STABLE_RELEASE_DEPLOY_KEY: ${{ secrets.STABLE_RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$STABLE_RELEASE_DEPLOY_KEY"
          key_path="$RUNNER_TEMP/stable-release-deploy-key"
          printf '%s\n' "$STABLE_RELEASE_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          git config --local core.sshCommand "ssh -i '$key_path' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

      - name: Publish exact qualified Stable release with semantic release
        if: github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUGAR_SUBSTITUTE_RELEASE_REPOSITORY_URL: git@github.com:${{ github.repository }}.git
        run: |
          set -euo pipefail
          npx semantic-release

      - name: Verify Stable release publication and exact asset inventory
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_VERSION: ${{ needs.stage-candidate.outputs.candidate_version }}
        run: |
          set -euo pipefail
          tag="v$CANDIDATE_VERSION"
          test "$(gh release view "$tag" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(":")')" = "false:false"
          test "$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName')" = "$tag"
          expected="$(find .local-release-channel -maxdepth 1 -type f ! -name '.release-notes.md' -printf '%f\n' | sort)"
          actual="$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)"
          test "$actual" = "$expected"

      - name: Download qualified Canary candidate
        if: needs.stage-candidate.outputs.candidate_channel == 'canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.stage-candidate.outputs.candidate_artifact_name }}
          path: build/canary-channel
          run-id: ${{ needs.stage-candidate.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Publish qualified bytes to the rolling Canary feed
        if: needs.stage-candidate.outputs.candidate_channel == 'canary'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_VERSION: ${{ needs.stage-candidate.outputs.candidate_version }}
        run: |
          set -euo pipefail
          channel_dir="build/canary-channel"
          readback_dir="build/canary-readback"
          canary_release_title="Canary ${CANDIDATE_VERSION/-canary./.}"
          mkdir -p "$readback_dir"
          python -c "import json, os, pathlib; payload=json.loads(pathlib.Path('$channel_dir/manifest.json').read_text()); assert payload['channel']=='canary', payload; assert payload['version']==os.environ['CANDIDATE_VERSION'], payload"
          (cd "$channel_dir" && sha256sum --check checksums.txt)

          if ! gh release view canary-latest --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create canary-latest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$canary_release_title" --notes-file "$channel_dir/.release-notes.md" --prerelease
          fi

          for asset in "$channel_dir"/*; do
            case "$(basename "$asset")" in
              manifest.json|*.exe|*.dmg|*.AppImage|*.deb) continue ;;
            esac
            gh release upload canary-latest "$asset" --repo "${{ github.repository }}" --clobber
          done
          gh release upload canary-latest "$channel_dir/manifest.json" --repo "${{ github.repository }}" --clobber
          for asset in "$channel_dir"/*.exe "$channel_dir"/*.dmg "$channel_dir"/*.AppImage "$channel_dir"/*.deb; do
            if [ -f "$asset" ]; then
              gh release upload canary-latest "$asset" --repo "${{ github.repository }}" --clobber
            fi
          done

          while IFS= read -r asset_name; do
            if [ ! -f "$channel_dir/$asset_name" ]; then
              gh release delete-asset canary-latest "$asset_name" --repo "${{ github.repository }}" --yes
            fi
          done < <(gh release view canary-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name')

          gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/canary-latest" -f sha="${{ github.sha }}" -F force=true > /dev/null
          gh release edit canary-latest --repo "${{ github.repository }}" --title "$canary_release_title" --notes-file "$channel_dir/.release-notes.md" --prerelease --latest=false
          gh release download canary-latest --repo "${{ github.repository }}" --pattern manifest.json --dir "$readback_dir"
          cmp "$channel_dir/manifest.json" "$readback_dir/manifest.json"
          test "$(gh release view canary-latest --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | join(":")')" = "false:true"
