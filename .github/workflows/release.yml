name: release

on:
  push:
    branches:
      - main
      - canary
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release in dry-run mode without publishing"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      qualification_scope:
        description: "Focused dry-run qualification; full runs every required gate"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - canary-fast
          - qualification-all
          - clean-all
          - clean-windows
          - clean-linux
          - clean-macos
          - updates-all
          - updates-windows
          - updates-linux
          - updates-macos
          - managed-comfy
      release_input_run_id:
        description: "Focused dry-run containing unchanged native release inputs"
        required: false
        default: ""
        type: string
      qualification_candidate_run_id:
        description: "Focused dry-run containing an already-staged candidate channel"
        required: false
        default: ""
        type: string
      qualification_candidate_version:
        description: "Exact version inside the already-staged candidate channel"
        required: false
        default: ""
        type: string
      candidate_artifact_name:
        description: "Exact private candidate artifact to reuse or stage"
        required: false
        default: "non-release-candidate-channel"
        type: string
      upgrade_selection:
        description: "Focused upgrade depth; full qualification always uses complete"
        required: false
        default: "complete"
        type: choice
        options:
          - complete
          - latest-only
      qualification_timeout_seconds:
        description: "Focused installer-chain timeout; full qualification requires 3600"
        required: false
        default: "3600"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Test, build, stage, and qualify release
    uses: ./.github/workflows/release-prepublication.yml
    with:
      channel: ${{ github.ref_name == 'canary' && 'canary' || 'stable' }}
      canary_run_number: ${{ github.ref_name == 'canary' && github.run_number || '' }}
      qualification_version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && github.ref_name != 'canary' && format('9999.0.{0}', github.run_number) || '' }}
      run_tests: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' || github.event.inputs.qualification_scope == 'full' }}
      force_candidate: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      release_input_run_id: ${{ inputs.release_input_run_id }}
      qualification_candidate_run_id: ${{ inputs.qualification_candidate_run_id }}
      qualification_candidate_version: ${{ inputs.qualification_candidate_version }}
      candidate_artifact_name: ${{ inputs.candidate_artifact_name || 'non-release-candidate-channel' }}
      qualification_scope: ${{ inputs.qualification_scope == '' && 'all' || inputs.qualification_scope == 'full' && 'all' || inputs.qualification_scope }}
      upgrade_selection: ${{ inputs.dry_run == 'true' && inputs.qualification_scope != 'full' && inputs.upgrade_selection || 'complete' }}
      qualification_timeout_seconds: ${{ inputs.dry_run == 'true' && inputs.qualification_scope != 'full' && inputs.qualification_timeout_seconds || '3600' }}

  publish-release:
    name: Publish exact qualified bytes
    needs: prepare-release
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.prepare-release.outputs.staged == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-publication.yml
    with:
      candidate_artifact_name: ${{ needs.prepare-release.outputs.candidate_artifact_name }}
      candidate_run_id: ${{ needs.prepare-release.outputs.candidate_run_id }}
      candidate_version: ${{ needs.prepare-release.outputs.candidate_version }}
      candidate_channel: ${{ needs.prepare-release.outputs.candidate_channel }}
    secrets: inherit
