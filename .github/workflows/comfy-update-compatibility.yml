name: Comfy update compatibility

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  LINUX_PYTHON_VERSION: "3.12.13"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  QT_OPENGL: software
  SUBSTITUTE_DISABLE_APP_USER_MODEL_ID: "1"
  SUBSTITUTE_DISABLE_CUTECANVAS_SAM_WARMUP: "1"

jobs:
  real-update-probe:
    name: ${{ matrix.source }} -> ${{ matrix.target }} (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            python-version: "3.12.10"
            python: ./.venv/Scripts/python.exe
            source: v0.15.0
            target: v0.19.0
          - name: Windows x64
            os: windows-latest
            python-version: "3.12.10"
            python: ./.venv/Scripts/python.exe
            source: v0.19.0
            target: v0.20.0
          - name: macOS Apple Silicon
            os: macos-15
            python-version: "3.12.10"
            python: ./.venv/bin/python
            source: v0.20.0
            target: v0.24.0
          - name: Windows x64
            os: windows-latest
            python-version: "3.12.10"
            python: ./.venv/Scripts/python.exe
            source: v0.24.0
            target: v0.25.0
          - name: Windows x64
            os: windows-latest
            python-version: "3.12.10"
            python: ./.venv/Scripts/python.exe
            source: v0.25.0
            target: v0.28.2
          - name: macOS Apple Silicon
            os: macos-15
            python-version: "3.12.10"
            python: ./.venv/bin/python
            source: v0.15.0
            target: v0.24.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout SugarSubstitute
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create project virtual environment
        run: python -m venv .venv
      - name: Install project test toolchain
        run: ${{ matrix.python }} -m pip install --requirement requirements-toolchain.txt
      - name: Run exact upstream update reconciliation probe
        run: >-
          ${{ matrix.python }} -m tools.ci.run_comfy_update_probe
          --source-tag ${{ matrix.source }}
          --target-tag ${{ matrix.target }}
