name: Comfy compatibility

on:
  push:
    branches:
      - canary
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-compatibility-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  real-tag-probe:
    name: Current runtime compatibility
    if: github.event_name != 'pull_request' || github.head_ref != 'canary' || github.base_ref != 'main'
    uses: ./.github/workflows/comfy-runtime-compatibility.yml

  real-update-probe:
    name: Update path compatibility
    if: github.event_name != 'pull_request' || github.head_ref != 'canary' || github.base_ref != 'main'
    uses: ./.github/workflows/comfy-update-compatibility.yml
