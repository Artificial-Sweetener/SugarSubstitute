name: packaged Linux system trust

on:
  workflow_call:
    inputs:
      candidate_artifact_name:
        description: "Private release channel containing the packaged AppImage"
        required: true
        type: string
      candidate_run_id:
        description: "Run containing the private release channel"
        required: true
        type: string
      candidate_version:
        description: "Exact version embedded into the candidate AppImage"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  linux-distro-trust:
    name: Packaged Linux trust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            ca_path: /etc/ssl/certs/ca-certificates.crt
            prepare: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates
          - name: Fedora 44
            image: fedora:44
            ca_path: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
            prepare: dnf install -y ca-certificates
          - name: Arch Linux
            image: archlinux:base
            ca_path: /etc/ssl/cert.pem
            prepare: pacman -Syu --noconfirm ca-certificates
          - name: openSUSE Leap 16
            image: opensuse/leap:16.0
            ca_path: /etc/ssl/ca-bundle.pem
            prepare: >-
              zypper --non-interactive refresh &&
              zypper --non-interactive install ca-certificates
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact private candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: build/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify packaged manifest and asset downloads through system trust
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_PREPARE: ${{ matrix.prepare }}
          EXPECTED_CA_PATH: ${{ matrix.ca_path }}
          MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
        run: |
          docker run --rm \
            --env APPIMAGE_EXTRACT_AND_RUN=1 \
            --env DISTRO_PREPARE \
            --env EXPECTED_CA_PATH \
            --env MANIFEST_URL \
            --env CANDIDATE_VERSION \
            --volume "$PWD/build/candidate:/artifacts:ro" \
            "$DISTRO_IMAGE" \
            /bin/sh -ec '
              eval "$DISTRO_PREPARE"
              test -r "$EXPECTED_CA_PATH"
              cp "/artifacts/SugarSubstitute-${CANDIDATE_VERSION}-Linux-x86_64.AppImage" /tmp/SugarSubstitute.AppImage
              chmod 755 /tmp/SugarSubstitute.AppImage
              /tmp/SugarSubstitute.AppImage \
                --verify-release-connectivity \
                --manifest-url "$MANIFEST_URL"
            '
