name: managed Comfy install

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - canary
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  LINUX_PYTHON_VERSION: "3.12.13"
  STANDALONE_CACHE: build/managed-comfy-cache

jobs:
  windows-cpu:
    name: Pinned managed Comfy (Windows CPU)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up verified Python toolchain
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore checksum-addressed standalone artifact
        uses: ./.github/actions/restore-managed-comfy-cache
        with:
          variant: win-cpu

      - name: Provision and launch the pinned managed Comfy environment
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          .\.venv\Scripts\python.exe tools\ci\verify_managed_comfy_install.py `
            --workspace "${{ runner.temp }}\managed-comfy" `
            --cache-root "${{ env.STANDALONE_CACHE }}" `
            --variant win-cpu
