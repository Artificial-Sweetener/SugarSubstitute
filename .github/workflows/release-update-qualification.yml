name: historical installer update qualification

on:
  workflow_call:
    inputs:
      candidate_version:
        description: "Exact semantic version contained in candidate assets"
        required: true
        type: string
      candidate_tag:
        description: "Optional published candidate tag"
        required: false
        default: ""
        type: string
      candidate_channel:
        description: "Stable or Canary channel embedded into candidate assets"
        required: true
        type: string
      candidate_artifact_name:
        description: "Optional private artifact containing candidate assets"
        required: false
        default: ""
        type: string
      candidate_run_id:
        description: "Run containing the private candidate artifact"
        required: false
        default: ""
        type: string
      qualification_timeout_seconds:
        description: "Total installer lifecycle timeout"
        required: true
        type: string
      upgrade_matrix:
        description: "JSON matrix of authoritative historical release sources"
        required: true
        type: string
      update_platforms:
        description: "JSON list of selected operating systems"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  PYTHON_VERSION: "3.12.10"
  LINUX_PYTHON_VERSION: "3.12.13"
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  CANDIDATE_TAG: ${{ inputs.candidate_tag }}
  EXPECTED_UPDATE_MANIFEST_URL: ${{ inputs.candidate_channel == 'canary' && format('https://github.com/{0}/releases/download/canary-latest/manifest.json', github.repository) || format('https://github.com/{0}/releases/latest/download/manifest.json', github.repository) }}
  QUALIFICATION_TIMEOUT_SECONDS: ${{ inputs.qualification_timeout_seconds }}
  STANDALONE_CACHE: build/managed-comfy-cache

jobs:
  historical-update:
    name: Update ${{ matrix.history.version }} and launch (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        history: ${{ fromJSON(inputs.upgrade_matrix) }}
        platform: ${{ fromJSON(inputs.update_platforms) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'linux' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up verified Python toolchain
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: ${{ matrix.platform == 'linux' && env.LINUX_PYTHON_VERSION || env.PYTHON_VERSION }}
      - name: Prepare exact Comfy source inputs
        id: comfy-source
        uses: ./.github/actions/prepare-comfy-source-cache
        with:
          python: python
      - name: Install Linux runtime dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/setup-linux-qt
      - name: Download temporary candidate channel
        if: inputs.candidate_artifact_name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: build/candidate
          run-id: ${{ inputs.candidate_run_id != '' && inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download exact published candidate installer
        if: inputs.candidate_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build/candidate | Out-Null
          $candidateAsset = switch ("${{ matrix.platform }}") {
            "windows" { "SugarSubstitute-$env:CANDIDATE_VERSION-Windows-x64-Setup.exe" }
            "linux" { "SugarSubstitute-$env:CANDIDATE_VERSION-Linux-x86_64.AppImage" }
            "macos" { "SugarSubstitute-$env:CANDIDATE_VERSION-macOS-Apple-Silicon.dmg" }
          }
          gh release download "$env:CANDIDATE_TAG" `
            --repo "${{ github.repository }}" `
            --pattern $candidateAsset `
            --dir build/candidate
      - name: Resolve exact candidate installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $candidateAsset = switch ("${{ matrix.platform }}") {
            "windows" { "SugarSubstitute-$env:CANDIDATE_VERSION-Windows-x64-Setup.exe" }
            "linux" { "SugarSubstitute-$env:CANDIDATE_VERSION-Linux-x86_64.AppImage" }
            "macos" { "SugarSubstitute-$env:CANDIDATE_VERSION-macOS-Apple-Silicon.dmg" }
          }
          $candidatePath = Join-Path "build/candidate" $candidateAsset
          if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
            throw "Exact candidate installer is missing: $candidatePath"
          }
          if ("${{ matrix.platform }}" -eq "linux") {
            chmod +x $candidatePath
          }
          "CANDIDATE_INSTALLER_ASSET=$((Resolve-Path -LiteralPath $candidatePath).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Mount exact candidate macOS installer
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "${{ runner.temp }}/candidate-dmg"
          hdiutil attach "$CANDIDATE_INSTALLER_ASSET" -mountpoint "${{ runner.temp }}/candidate-dmg" -nobrowse
          echo "CANDIDATE_INSTALLER=${{ runner.temp }}/candidate-dmg/SugarSubstitute Setup.app/Contents/MacOS/SugarSubstitute Setup" >> "$GITHUB_ENV"
      - name: Select exact candidate installer executable
        if: matrix.platform != 'macos'
        shell: pwsh
        run: |
          "CANDIDATE_INSTALLER=$env:CANDIDATE_INSTALLER_ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download real historical installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build/historical-installer | Out-Null
          $assetPattern = switch ("${{ matrix.platform }}") {
            "windows" { "SugarSubstitute-*-Windows-x64*.exe" }
            "linux" { "SugarSubstitute-*-Linux-x86_64.AppImage" }
            "macos" { "SugarSubstitute-*-macOS-Apple-Silicon.dmg" }
          }
          gh release download "${{ matrix.history.tag }}" `
            --repo "${{ github.repository }}" `
            --pattern $assetPattern `
            --dir build/historical-installer
          $historicalInstallers = @(Get-ChildItem build/historical-installer -File)
          if ($historicalInstallers.Count -ne 1) {
            throw "Expected exactly one historical installer matching '$assetPattern' for ${{ matrix.history.tag }} on ${{ matrix.platform }}; found $($historicalInstallers.Count)."
          }
          $path = $historicalInstallers[0].FullName
          if ("${{ matrix.platform }}" -eq "linux") {
            chmod +x $path
          }
          "HISTORICAL_INSTALLER=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Mount real historical macOS installer
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "${{ runner.temp }}/historical-dmg"
          hdiutil attach "$HISTORICAL_INSTALLER" -mountpoint "${{ runner.temp }}/historical-dmg" -nobrowse
          echo "HISTORICAL_INSTALLER=${{ runner.temp }}/historical-dmg/SugarSubstitute Setup.app/Contents/MacOS/SugarSubstitute Setup" >> "$GITHUB_ENV"
      - name: Reconstitute exact historical macOS install channel
        if: matrix.platform == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ matrix.history.version }}"
          New-Item -ItemType Directory -Force build/historical-channel | Out-Null
          gh release download "${{ matrix.history.tag }}" `
            --repo "${{ github.repository }}" `
            --pattern manifest.json `
            --pattern "SugarSubstitute-app-v$version.zip" `
            --pattern "SugarSubstitute-installer-payload-macos-arm64-v$version.zip" `
            --dir build/historical-channel
          python -m tools.ci.reconstitute_historical_macos_release `
            --source-root build/historical-channel `
            --output-root build/historical-channel-reconstituted
          "HISTORICAL_RELEASE_ROOT=$((Resolve-Path build/historical-channel-reconstituted).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Prove historical update, splash, and main shell
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: ${{ matrix.platform == 'macos' && 'cocoa' || 'offscreen' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $candidateSource = if ("${{ inputs.candidate_artifact_name }}" -ne "") {
            @("--candidate-release-root", "build/candidate")
          } else {
            @("--candidate-manifest-url", $env:EXPECTED_UPDATE_MANIFEST_URL)
          }
          $publishedChannel = if ("${{ inputs.candidate_tag }}" -ne "") {
            @(
              "--expected-update-manifest-url", $env:EXPECTED_UPDATE_MANIFEST_URL
            )
          } else {
            @()
          }
          $historicalSource = if ($env:HISTORICAL_RELEASE_ROOT) {
            @("--historical-release-root", $env:HISTORICAL_RELEASE_ROOT)
          } else {
            @()
          }
          python tools/ci/verify_installer_lifecycle.py upgrade `
            --historical-installer "$env:HISTORICAL_INSTALLER" `
            --install-root "${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}" `
            --historical-manifest-url "https://github.com/${{ github.repository }}/releases/download/${{ matrix.history.tag }}/manifest.json" `
            @historicalSource `
            --historical-version "${{ matrix.history.version }}" `
            --historical-published-at "${{ matrix.history.published_at }}" `
            --source-cache "${{ steps.comfy-source.outputs.cache-path }}" `
            @candidateSource `
            --candidate-installer "$env:CANDIDATE_INSTALLER" `
            --candidate-channel "${{ inputs.candidate_channel }}" `
            @publishedChannel `
            --timeout-seconds "$env:QUALIFICATION_TIMEOUT_SECONDS" `
            --candidate-version "$env:CANDIDATE_VERSION"
      - name: Upload historical-update diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6.0.0
        with:
          name: historical-update-diagnostics-${{ matrix.platform }}-${{ matrix.history.version }}
          path: |
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/launcher/logs/**
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/launcher/readiness/**
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/launcher/config.json
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/launcher/state.json
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/appdata/diagnostics/logs/**
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/appdata/runtime_state/**
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/user/settings/**
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/managed-comfy-startup.log
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/historical-managed-comfy-startup.log
            ${{ runner.temp }}/SugarSubstitute-${{ matrix.history.version }}/launcher/locks/application-launch.lock
            ${{ runner.temp }}/.historical-certificate/requests.jsonl
            ${{ runner.temp }}/.candidate-certificate/requests.jsonl
            ${{ runner.temp }}/.SugarSubstitute-${{ matrix.history.version }}-*-installer-qualification.jsonl
            build/historical-channel-reconstituted/historical-reconstitution.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Unmount historical DMG
        if: always() && matrix.platform == 'macos'
        run: |
          hdiutil detach "${{ runner.temp }}/historical-dmg" || true
          hdiutil detach "${{ runner.temp }}/candidate-dmg" || true
