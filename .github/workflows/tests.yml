name: Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "17 13 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/quality-gates.yml

  platform-tests:
    name: Supported-platform tests
    uses: ./.github/workflows/platform-tests.yml

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml
