name: cross-platform validation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  tests:
    name: Required cross-platform tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build private native validation channel
    needs: tests
    uses: ./.github/workflows/cross-platform-build.yml
    with:
      version: ${{ format('0.9.{0}', github.run_number) }}

  linux-system-trust:
    name: Packaged Linux system trust
    needs: build
    uses: ./.github/workflows/linux-system-trust.yml

  installed-app-smoke:
    name: Installed application smoke
    needs: build
    uses: ./.github/workflows/installed-app-smoke.yml
